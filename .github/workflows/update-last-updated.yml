name: Update website timestamp

on:
  push:
    branches:
      - main
    paths:
      - index.html

permissions:
  contents: write

jobs:
  update-footer:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update footer month
        run: |
          month_year="$(TZ=America/New_York date '+%B %Y')"
          sed -i -E "s/Last Updated [A-Za-z]+ [0-9]{4}/Last Updated ${month_year}/" index.html

      - name: Commit the updated timestamp
        run: |
          if git diff --quiet -- index.html; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update website timestamp"
          git push
